# ===============================
# Application Configuration
# ===============================
spring.application.name=Resume-analyser

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=${url}
spring.datasource.username=${uname}
spring.datasource.password=${upass}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# JPA / Hibernate Settings
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# API / Custom Keys
# ===============================
genKey=${genkey}

# ===============================
# Mail Configuration
# ===============================
spring.mail.host=${mailhost:smtp.gmail.com}
spring.mail.port=${mailport:587}
spring.mail.username=${mailusername}
spring.mail.password=${mailpassword}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# File Upload Settings
# ===============================
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# ===============================
# HikariCP
# ===============================
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=20000

# ===============================
# Server
# ===============================
server.port=${PORT:8080}

# ===============================
# Logging
# ===============================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG

# ===============================
# Google OAuth2
# ===============================
spring.security.oauth2.client.registration.google.client-id=${gcpid}
spring.security.oauth2.client.registration.google.client-secret=${gcpsecret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# ===============================
# JWT
# ===============================
jwt-key=${jwtkey}
